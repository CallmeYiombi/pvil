# RxRx3-core 분할·crop 설정. 사용: python scripts/segment.py configs/preprocess/rxrx3_core.yaml --shard 0/8
dataset: rxrx3_core
base: configs/base_cpbg.yaml        # data.crop_size, border_exclusion_px, qc_quantiles, segmentation
raw_root: ${oc.env:PVIL_DATA}/raw/rxrx3_core

wells:
  filter: {perturbation_type: [CRISPR]}
  source_col: plate                  # 배치 키 = 실험 내 plate 번호 1–9
  heldout_source: "4"
  label_col: gene
  roles:                             # 확정(decisions.md 2026-10-14). 나머지(Exon·양성대조군·EMPTY)는 exclude. 원문 735 / 104,166과의 차이는 결정 로그 참고
    perturbation: {well_type_label: [Query guides]}
    control: {well_type_label: [Intron controls]}

channels:
  names: [ch1, ch2, ch3, ch4, ch5, ch6]
  nucleus: ch1                       # 몽타주로 확인
  cell: ch3                          # 액틴 섬유로 확인

sampling:
  n_per_pert_source: 200
  seed: 0
